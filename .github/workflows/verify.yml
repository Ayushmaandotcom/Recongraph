name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov mypy
        pip install -e .
        
    - name: Run mypy
      run: |
        mypy src/recongraph
        
    - name: Run challenge referee
      run: |
        python -m pytest tests/test_challenge_referee.py -v

    - name: Run tests
      run: |
        pytest -q
