name: ReconGraph Production CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        
    - name: Run Backend Tests (Security, AI, RAG)
      run: |
        PYTHONPATH=src pytest tests/ --cov=src --cov-report=xml
        
    - name: Upload Coverage
      uses: codecov/codecov-action@v3
      
  build-and-deploy:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Images
      run: |
        docker-compose -f docker-compose.prod.yml build
        
    - name: Push to ECR / Registry
      run: |
        echo "Pushing to registry..."
        # Add registry login and push steps here
        
    - name: Deploy to Kubernetes
      run: |
        echo "Deploying..."
        # Add kubectl apply steps here
